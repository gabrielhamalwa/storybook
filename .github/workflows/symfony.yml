name: Symfony

on:
  push:
    branches:
      - next
    paths:
      - 'code/renderers/symfony/**'
      - 'code/frameworks/symfony-vite/**'
      - 'test-storybooks/symfony-*/**'
      - '.github/workflows/symfony.yml'
  pull_request:
    paths:
      - 'code/renderers/symfony/**'
      - 'code/frameworks/symfony-vite/**'
      - 'test-storybooks/symfony-*/**'
      - '.github/workflows/symfony.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monorepo-checks:
    name: Monorepo renderer/framework checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --immutable

      - run: yarn nx run-many -t check -p symfony-renderer symfony-vite

      - run: yarn nx compile symfony-renderer

      - run: yarn nx compile symfony-vite

  kitchen-sink-e2e:
    name: Symfony Vite kitchen sink E2E
    runs-on: ubuntu-latest
    needs: monorepo-checks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - uses: shivammathur/setup-php@9e72090525849c4e268e0af93c4932be26f1fa8e # 2.32.0
        with:
          php-version: '8.3'
          tools: composer

      - run: yarn install --immutable

      - run: yarn playwright install --with-deps chromium firefox webkit

      - run: yarn nx compile symfony-renderer

      - run: yarn nx compile symfony-vite

      - name: Install Symfony kitchen sink dependencies
        run: |
          cd test-storybooks/symfony-vite-kitchen-sink
          composer install --no-interaction --prefer-dist

      - name: Run kitchen sink E2E tests
        run: |
          cd test-storybooks/symfony-vite-kitchen-sink
          yarn e2e:ci

      - name: Run static PHP-WASM E2E tests
        run: |
          cd test-storybooks/symfony-vite-kitchen-sink
          yarn e2e:static
