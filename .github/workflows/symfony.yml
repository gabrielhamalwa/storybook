name: Symfony

on:
  push:
    branches:
      - next
    paths:
      - 'code/renderers/symfony/**'
      - 'code/frameworks/symfony-vite/**'
      - 'test-storybooks/symfony-*/**'
      - '.github/workflows/symfony.yml'
  pull_request:
    paths:
      - 'code/renderers/symfony/**'
      - 'code/frameworks/symfony-vite/**'
      - 'test-storybooks/symfony-*/**'
      - '.github/workflows/symfony.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # TODO: Re-enable bundle PHPUnit tests once storybookjs/storybook-symfony-bundle
  # is a public repository. Until then, the bundle is a separate local workspace.
  monorepo-checks:
    name: Monorepo renderer/framework checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --immutable

      - run: yarn nx run-many -t check -p symfony-renderer symfony-vite
